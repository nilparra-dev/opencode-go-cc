# Example configuration for occb (OpenCode Claude Bridge).
# Place this file at ~/.config/occb/config.yaml
# Models updated: May 2026

# Your OpenCode Go API key. Can also be set via OCB_API_KEY env var.
api_key: "${OCB_API_KEY}"

# Proxy server listen address
host: "127.0.0.1"
port: 3456

# Enable hot reload of config file
hot_reload: false

# Route streaming requests using scenario rules instead of fast model
# Claude Code always streams; leave this on or every request is routed to the "fast" model.
enable_streaming_scenario_routing: true

# Use the model picked in Claude Code's /model menu as-is. Set to false to let
# scenario routing choose the model instead.
respect_requested_model: true

# Requests for official claude-* models are forwarded untouched to Anthropic
# (using your own Claude login or API key), so they keep working alongside
# the OpenCode models. Set passthrough to false to disable.
anthropic:
  passthrough: true
  base_url: "https://api.anthropic.com"

# Model routing configuration
# Anthropic-compat models: qwen3.5-plus, qwen3.6-plus, qwen3.7-max, minimax-m2.5, minimax-m2.7
# OpenAI-compat models: glm-5, glm-5.1, kimi-k2.5, kimi-k2.6, deepseek-v4-pro, deepseek-v4-flash, mimo-v2.5, mimo-v2.5-pro
models:
  default:
    provider: "opencode-go"
    model_id: "kimi-k2.6"
    temperature: 0.7
    max_tokens: 4096

  background:
    provider: "opencode-go"
    model_id: "qwen3.5-plus"
    temperature: 0.5
    max_tokens: 2048

  think:
    provider: "opencode-go"
    model_id: "glm-5"
    temperature: 0.7
    max_tokens: 8192

  complex:
    provider: "opencode-go"
    model_id: "glm-5.1"
    temperature: 0.7
    max_tokens: 4096

  long_context:
    provider: "opencode-go"
    model_id: "minimax-m2.5"
    temperature: 0.7
    max_tokens: 16384
    context_threshold: 80000

  fast:
    provider: "opencode-go"
    model_id: "qwen3.6-plus"
    temperature: 0.7
    max_tokens: 4096

# Fallback chains when a model fails
fallbacks:
  default:
    - provider: "opencode-go"
      model_id: "mimo-v2.5-pro"
    - provider: "opencode-go"
      model_id: "qwen3.6-plus"

  background:
    - provider: "opencode-go"
      model_id: "qwen3.6-plus"
    - provider: "opencode-go"
      model_id: "minimax-m2.5"

  think:
    - provider: "opencode-go"
      model_id: "kimi-k2.6"
    - provider: "opencode-go"
      model_id: "mimo-v2.5-pro"

  complex:
    - provider: "opencode-go"
      model_id: "glm-5"
    - provider: "opencode-go"
      model_id: "kimi-k2.6"

  long_context:
    - provider: "opencode-go"
      model_id: "minimax-m2.7"
    - provider: "opencode-go"
      model_id: "kimi-k2.6"

  fast:
    - provider: "opencode-go"
      model_id: "qwen3.5-plus"
    - provider: "opencode-go"
      model_id: "minimax-m2.5"

# OpenCode Go upstream API configuration
opencode_go:
  base_url: "https://opencode.ai/zen/go/v1/chat/completions"
  anthropic_base_url: "https://opencode.ai/zen/go/v1/messages"
  timeout_ms: 300000

# Logging configuration
logging:
  level: "info"
  requests: true
